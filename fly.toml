# fly.toml app configuration file generated for music-edit-webapp on 2026-07-18T07:57:33+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'music-edit-webapp'
primary_region = 'nrt'

[build]
[http_service]
  internal_port = 8000
  force_https = true
  # 日次利用量上限（プロセス内メモリ+永続化ファイル）を再起動のたびに揺らさないよう、
  # アイドル時の自動停止・自動起動は使わず常時1台起動しておく（HOSTING.mdの前提と一致させる）。
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '3gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 3072

[mounts]
  source = 'music_edit_webapp_storage'
  destination = '/app/backend/storage'
